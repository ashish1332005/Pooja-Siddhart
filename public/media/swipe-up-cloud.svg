<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffefb" stop-opacity="0.97" />
      <stop offset="60%" stop-color="#faf5ea" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f3ebd7" stop-opacity="0.92" />
    </linearGradient>
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(35,25,15,0.22)" />
