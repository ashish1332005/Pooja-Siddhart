  </defs>
  <!-- Main Cloud Silhouette -->
  <path
    d="M 38,78 C 65,82 155,82 182,78 C 204,78 216,60 203,45 C 210,26 182,16 161,24 C 146,6 74,6 59,24 C 38,16 10,26 17,45 C 4,60 16,78 38,78 Z"
